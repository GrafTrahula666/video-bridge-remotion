name: Preserve surviving source video
on:
  push:
    paths:
      - '.github/workflows/preserve-second-temp.yml'
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Download second source
        run: |
          curl -L --fail --retry 4 --retry-all-errors \
            'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/e495c70f-ce78-45a2-b83a-3755eff4caf7/source-video.mp4' \
            -o source-video-2.mp4
          ls -lh source-video-2.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json source-video-2.mp4
      - name: Upload preserved copy
        uses: actions/upload-artifact@v4
        with:
          name: preserved-source-video-2
          path: source-video-2.mp4
          compression-level: 0
          retention-days: 3
