name: Verify supplied blob links
on:
  push:
    paths:
      - '.github/workflows/check-blob-links-temp.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check both URLs
        run: |
          for u in \
          'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/cd188799-33eb-49b8-85c6-969aa2492b42/source-video.mp4' \
          'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/e495c70f-ce78-45a2-b83a-3755eff4caf7/source-video.mp4'; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$u" || true)
            echo "$code $u"
          done
