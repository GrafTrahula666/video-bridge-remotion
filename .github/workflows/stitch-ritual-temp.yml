name: Stitch ritual videos

on:
  push:
    paths:
      - '.github/workflows/stitch-ritual-temp.yml'
  workflow_dispatch:

jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download source videos
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/cd188799-33eb-49b8-85c6-969aa2492b42/source-video.mp4' \
            -o v1.mp4
          curl -L --fail --retry 4 --retry-all-errors \
            'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/e495c70f-ce78-45a2-b83a-3755eff4caf7/source-video.mp4' \
            -o v2.mp4
          ls -lh v1.mp4 v2.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json v1.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json v2.mp4

      - name: Detect visual overlap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy pillow
          python3 <<'PY'
          import json, math, os, subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image

          def duration(path):
              return float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',path
              ], text=True).strip())

          d1 = duration('v1.mp4')
          window = min(3.0, d1)
          start = max(0.0, d1-window)
          Path('tail').mkdir(exist_ok=True)
          Path('head').mkdir(exist_ok=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{start:.6f}','-i','v1.mp4','-t',f'{window:.6f}',
                          '-vf','fps=12,scale=128:128:force_original_aspect_ratio=decrease,pad=128:128:(ow-iw)/2:(oh-ih)/2,format=gray',
                          'tail/%04d.png'], check=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-i','v2.mp4','-t',f'{window:.6f}',
                          '-vf','fps=12,scale=128:128:force_original_aspect_ratio=decrease,pad=128:128:(ow-iw)/2:(oh-ih)/2,format=gray',
                          'head/%04d.png'], check=True)

          def load(dirn):
              arr=[]
              for p in sorted(Path(dirn).glob('*.png')):
                  arr.append(np.asarray(Image.open(p), dtype=np.float32))
              return arr
          a,b=load('tail'),load('head')
          maxk=min(len(a),len(b),36)
          best=(0,999.0)
          # Longest suffix/prefix with low normalized mean absolute error.
          for k in range(1,maxk+1):
              scores=[]
              for i in range(k):
                  x=a[len(a)-k+i]
                  y=b[i]
                  scores.append(float(np.mean(np.abs(x-y)))/255.0)
              score=float(np.mean(scores))
              # Favor longer overlap when visually close.
              if score < 0.075:
                  best=(k,score)
          if best[0] == 0:
              # Always remove one shared start/end frame when only the boundary frame matches.
              best=(1, float(np.mean(np.abs(a[-1]-b[0])))/255.0 if a and b else 0.0)
          overlap=best[0]/12.0
          # Cap to avoid deleting meaningful action in case of a static scene.
          overlap=min(overlap,1.5)
          print(f'Detected overlap frames={best[0]} score={best[1]:.5f} seconds={overlap:.6f}')
          Path('overlap.txt').write_text(f'{overlap:.6f}')
          PY
          cat overlap.txt

      - name: Build seamless joined picture
        shell: bash
        run: |
          set -euo pipefail
          OVERLAP="$(cat overlap.txt)"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 v1.mp4)"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 v1.mp4)"
          FPS_EXPR="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 v1.mp4)"
          FPS="$(python3 - <<PY
          from fractions import Fraction
          print(float(Fraction('$FPS_EXPR')))
          PY
          )"
          D1="$(ffprobe -v error -show_entries format=duration -of csv=p=0 v1.mp4)"
          D2="$(ffprobe -v error -show_entries format=duration -of csv=p=0 v2.mp4)"
          FINAL_DUR="$(python3 - <<PY
          print(max(0.1,float('$D1')+float('$D2')-float('$OVERLAP')))
          PY
          )"
          echo "$W $H $FPS $D1 $D2 $OVERLAP $FINAL_DUR" | tee render-meta.txt

          ffmpeg -y -hide_banner -loglevel warning \
            -i v1.mp4 -i v2.mp4 \
            -filter_complex "[0:v]scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,fps=${FPS},setsar=1,setpts=PTS-STARTPTS[v0];[1:v]trim=start=${OVERLAP},setpts=PTS-STARTPTS,scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,fps=${FPS},setsar=1[v1];[v0][v1]concat=n=2:v=1:a=0[v]" \
            -map '[v]' -an -c:v libx264 -preset slow -crf 14 -profile:v high -pix_fmt yuv420p -movflags +faststart joined-video.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate,codec_name -of json joined-video.mp4

      - name: Create original dark shamanic soundtrack
        shell: bash
        run: |
          set -euo pipefail
          FINAL_DUR="$(awk '{print $7}' render-meta.txt)"
          python3 <<PY
          import math, wave, random
          import numpy as np

          dur=float('$FINAL_DUR')
          sr=48000
          n=max(1,int(dur*sr))
          t=np.arange(n,dtype=np.float64)/sr
          rng=np.random.default_rng(20260827)

          # Slow evolving forest/ritual drone.
          mod=0.68+0.32*np.sin(2*np.pi*0.055*t+0.8)
          drone=(0.14*np.sin(2*np.pi*55*t)+0.075*np.sin(2*np.pi*82.5*t+0.5)+0.05*np.sin(2*np.pi*110*t+1.1))*mod
          air=rng.normal(0,1,n)
          # Simple smoothing for soft atmospheric noise.
          k=220
          air=np.convolve(air,np.ones(k)/k,mode='same')*0.055
          music=drone+air

          def add_drum(at, amp=0.55, pan=0.0):
              nonlocal_dummy=None
              start=int(at*sr)
              L=min(n-start,int(0.75*sr))
              if L<=0:return
              x=np.arange(L)/sr
              env=np.exp(-6.0*x)
              freq=105*np.exp(-2.6*x)+44
              phase=2*np.pi*np.cumsum(freq)/sr
              tone=np.sin(phase)
              noise=rng.normal(0,1,L)*np.exp(-14*x)
              mono=amp*env*(0.82*tone+0.18*noise)
              music[start:start+L]+=mono

          # Sparse opening, then increasingly ritualistic percussion.
          beat=60/82.0
          at=max(2.0,dur*0.22)
          i=0
          while at < dur*0.90:
              progress=at/dur
              amp=0.32+0.38*progress
              add_drum(at,amp)
              if progress>0.52 and i%2==1:
                  add_drum(at+beat*0.5,amp*0.55)
              if progress>0.72:
                  add_drum(at+beat*0.25,amp*0.35)
              at+=beat
              i+=1

          # Jaw-harp-like metallic pulses in the second half.
          for at in np.arange(max(3.0,dur*0.43), dur*0.88, beat*2):
              start=int(at*sr); L=min(n-start,int(0.9*sr))
              if L<=0: continue
              x=np.arange(L)/sr
              env=np.exp(-3.8*x)
              f=122+7*np.sin(2*np.pi*4.5*x)
              phase=2*np.pi*np.cumsum(f)/sr
              sig=(np.sin(phase)+0.42*np.sin(2*phase)+0.22*np.sin(3*phase))*env*0.12
              music[start:start+L]+=sig

          # Rising sub energy into climax.
          rise_start=int(dur*0.62*sr)
          if rise_start<n:
              x=t[rise_start:]-t[rise_start]
              rise=np.clip(x/max(0.1,dur*0.25),0,1)
              music[rise_start:]+=0.075*rise*np.sin(2*np.pi*(41+3*rise)*x)

          # Brief peak, then release in final 8%.
          fade_start=int(dur*0.92*sr)
          if fade_start<n:
              fade=np.linspace(1.0,0.34,n-fade_start)
              music[fade_start:]*=fade

          # Add a subtle wide stereo image.
          delay=int(0.012*sr)
          left=music.copy()
          right=np.concatenate([np.zeros(delay),music[:-delay]]) if delay<n else music.copy()
          stereo=np.stack([left,right],axis=1)
          peak=np.max(np.abs(stereo)) or 1.0
          stereo=np.tanh(stereo/(peak*0.92))*0.84
          pcm=np.int16(np.clip(stereo,-1,1)*32767)
          with wave.open('ritual-music.wav','wb') as wf:
              wf.setnchannels(2); wf.setsampwidth(2); wf.setframerate(sr); wf.writeframes(pcm.tobytes())
          print('soundtrack seconds',dur,'samples',n)
          PY

      - name: Preserve useful source audio and mix soundtrack
        shell: bash
        run: |
          set -euo pipefail
          OVERLAP="$(cat overlap.txt)"
          D1="$(ffprobe -v error -show_entries format=duration -of csv=p=0 v1.mp4)"
          FINAL_DUR="$(awk '{print $7}' render-meta.txt)"

          has_audio() { ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$1" | grep -q .; }
          if has_audio v1.mp4; then
            ffmpeg -y -hide_banner -loglevel error -i v1.mp4 -vn -ar 48000 -ac 2 a1.wav
          else
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i anullsrc=r=48000:cl=stereo -t "$D1" a1.wav
          fi
          D2="$(ffprobe -v error -show_entries format=duration -of csv=p=0 v2.mp4)"
          D2TRIM="$(python3 - <<PY
          print(max(0.05,float('$D2')-float('$OVERLAP')))
          PY
          )"
          if has_audio v2.mp4; then
            ffmpeg -y -hide_banner -loglevel error -ss "$OVERLAP" -i v2.mp4 -t "$D2TRIM" -vn -ar 48000 -ac 2 a2.wav
          else
            ffmpeg -y -hide_banner -loglevel error -f lavfi -i anullsrc=r=48000:cl=stereo -t "$D2TRIM" a2.wav
          fi
          printf "file '%s'\nfile '%s'\n" "$PWD/a1.wav" "$PWD/a2.wav" > audio-list.txt
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i audio-list.txt -ar 48000 -ac 2 original-audio.wav

          ffmpeg -y -hide_banner -loglevel warning \
            -i joined-video.mp4 -i ritual-music.wav -i original-audio.wav \
            -filter_complex "[1:a]volume=0.82[m];[2:a]volume=0.30[o];[m][o]amix=inputs=2:duration=first:dropout_transition=0,acompressor=threshold=-12dB:ratio=2.2:attack=15:release=180,loudnorm=I=-14:TP=-1.2:LRA=9[a]" \
            -map 0:v:0 -map '[a]' -c:v copy -c:a aac -b:a 320k -ar 48000 -t "$FINAL_DUR" -movflags +faststart shaman-ritual-final.mp4

          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json shaman-ritual-final.mp4
          ls -lh shaman-ritual-final.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: shaman-ritual-final
          path: shaman-ritual-final.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
