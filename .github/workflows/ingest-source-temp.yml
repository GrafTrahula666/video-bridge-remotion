name: Ingest source video
on:
  push:
    paths:
      - '.github/workflows/ingest-source-temp.yml'
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -L --fail --retry 4 --retry-all-errors \
            'https://nfmas1ki6eodzo0p.public.blob.vercel-storage.com/uploads/2026-08-26/b4e5cd97-02d9-40b0-9095-65db7d2c7cae/source-video.mp4' \
            -o source-video-1.mp4
          test -s source-video-1.mp4
          echo '---FILE---'
          ls -lh source-video-1.mp4
          echo '---FFPROBE---'
          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,pix_fmt \
            -of json source-video-1.mp4
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-video-1-ingested
          path: source-video-1.mp4
          compression-level: 0
          retention-days: 3
